model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
personality = "pragmatic"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
max_depth = 1

[agents.luna_reader]
description = "Read-only bulk extraction, classification, and structured-summary worker."
config_file = "agents/luna-reader.toml"

[agents.terra_executor]
description = "Implementation executor for one approved atomic step plus targeted tests."
config_file = "agents/terra-executor.toml"

[mcp_servers]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[plugins."github@openai-curated"]
enabled = true

[features]
memories = true

[memories]
generate_memories = true
use_memories = true
